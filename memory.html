<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match — Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <main class="app">
    <a class="back" href="index.html">All games</a>

    <header class="head">
      <h1>Memory Match</h1>
      <p class="status" id="status" aria-live="polite">Find the six pairs</p>
    </header>

    <div class="board-wrap">
      <div class="memory" id="memory" role="group" aria-label="Memory board, 4 by 3">
        <!-- cards injected by memory.js -->
      </div>

      <!-- End-of-round announcement; the status line carries it for screen readers -->
      <div class="result" id="result" hidden aria-hidden="true">
        <p class="result-title" id="result-title"></p>
        <p class="result-sub" id="result-sub"></p>
      </div>
    </div>

    <section class="scores" aria-label="Scores">
      <div class="score">
        <span class="score-label">Moves</span>
        <span class="score-value" id="moves">0</span>
      </div>
      <div class="score">
        <span class="score-label">Pairs</span>
        <span class="score-value" id="pairs">0</span>
      </div>
      <div class="score">
        <span class="score-label">Best</span>
        <span class="score-value" id="best">—</span>
      </div>
    </section>

    <div class="actions">
      <button class="btn" id="restart" type="button">New game</button>
      <button class="btn btn-ghost" id="reset-best" type="button">Reset best</button>
    </div>
  </main>

  <!-- ?v= must be bumped whenever memory.js or styles.css change, or browsers serve a stale cached copy -->
  <script src="memory.js?v=1"></script>
</body>
</html>
