<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake — Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <main class="app">
    <a class="back" href="index.html">All games</a>

    <header class="head">
      <h1>Snake</h1>
      <p class="status" id="status" aria-live="polite">Swipe or press an arrow to start</p>
    </header>

    <div class="board-wrap">
      <div class="lcd">
        <!-- Fixed 16x16 pixel grid, scaled up - keeps the blocky Nokia look -->
        <canvas id="screen" width="256" height="256" role="img" aria-label="Snake board"></canvas>
      </div>

      <!-- End-of-round announcement; the status line carries it for screen readers -->
      <div class="result result-lcd" id="result" hidden aria-hidden="true">
        <p class="result-title" id="result-title"></p>
        <p class="result-sub" id="result-sub"></p>
      </div>
    </div>

    <section class="scores two" aria-label="Scores">
      <div class="score">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score">
        <span class="score-label">Best</span>
        <span class="score-value" id="best">0</span>
      </div>
    </section>

    <div class="dpad" role="group" aria-label="Direction controls">
      <button class="pad pad-up"    type="button" data-dir="up"    aria-label="Up">▲</button>
      <button class="pad pad-left"  type="button" data-dir="left"  aria-label="Left">◀</button>
      <button class="pad pad-right" type="button" data-dir="right" aria-label="Right">▶</button>
      <button class="pad pad-down"  type="button" data-dir="down"  aria-label="Down">▼</button>
    </div>

    <div class="actions">
      <button class="btn" id="restart" type="button">New game</button>
      <button class="btn btn-ghost" id="reset-best" type="button">Reset best</button>
    </div>
  </main>

  <!-- ?v= must be bumped whenever snake.js or styles.css change, or browsers serve a stale cached copy -->
  <script src="snake.js?v=3"></script>
</body>
</html>
