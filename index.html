<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Game Room</h1>
      <p class="status">Pick a game to play</p>
    </header>

    <nav class="menu" aria-label="Games">
      <a class="game-card" href="tictactoe.html" style="--tint: var(--x)">
        <span class="game-art">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 8 L10.5 15 M10.5 8 L3.5 15"/>
            <circle cx="17" cy="11.5" r="4"/>
          </svg>
        </span>
        <span class="game-text">
          <span class="game-name">Tic Tac Toe</span>
          <span class="game-desc">Classic 3×3 duel.</span>
        </span>
        <span class="game-slot"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg></span></span>
      </a>

      <a class="game-card" href="hangman.html" style="--tint: #7ed3a5">
        <span class="game-art">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 21 H13 M6.5 21 V3 H17 V6.5"/>
            <circle cx="17" cy="9.5" r="3"/>
          </svg>
        </span>
        <span class="game-text">
          <span class="game-name">Hangman</span>
          <span class="game-desc">Solve 10 words on 5 lives.</span>
        </span>
        <span class="game-slot"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg></span></span>
      </a>

      <div class="game-card is-soon" style="--tint: var(--o)">
        <span class="game-art">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="8" height="11" rx="2"/>
            <rect x="13" y="9" width="8" height="11" rx="2"/>
          </svg>
        </span>
        <span class="game-text">
          <span class="game-name">Memory Match</span>
          <span class="game-desc">Find every matching pair.</span>
        </span>
        <span class="game-slot"><span class="badge">Soon</span></span>
      </div>

      <div class="game-card is-soon" style="--tint: #5fd2c4">
        <span class="game-art">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19 h7 a3.5 3.5 0 0 0 0-7 H9 a3.5 3.5 0 0 1 0-7 h6"/>
            <circle cx="19" cy="5" r="1.8" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="game-text">
          <span class="game-name">Snake</span>
          <span class="game-desc">Eat, grow, don't crash.</span>
        </span>
        <span class="game-slot"><span class="badge">Soon</span></span>
      </div>

      <div class="game-card is-soon" style="--tint: #c69bf0">
        <span class="game-art">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="15.5" r="2" fill="currentColor" stroke="none"/>
            <circle cx="15.5" cy="15.5" r="2" fill="currentColor" stroke="none"/>
            <circle cx="8.5" cy="8.5" r="2"/>
            <circle cx="15.5" cy="8.5" r="2"/>
          </svg>
        </span>
        <span class="game-text">
          <span class="game-name">Connect Four</span>
          <span class="game-desc">Drop discs, line up four.</span>
        </span>
        <span class="game-slot"><span class="badge">Soon</span></span>
      </div>
    </nav>
  </main>
</body>
</html>
