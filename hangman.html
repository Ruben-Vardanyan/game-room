<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman — Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <a class="back" href="index.html">
      <span class="back-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg>
      </span>
      All games
    </a>

    <header class="head">
      <h1>Hangman</h1>
      <p class="rules">Solve 10 words. 5 wrong letters and you're out.</p>
    </header>

    <div class="hm-meter">
      <div class="hm-meter-row">
        <span class="hm-meter-label">Word <span class="hm-meter-value"><span id="round">1</span> of 10</span></span>
        <span class="hm-lives" id="lives" aria-label="Lives remaining"></span>
      </div>
      <div class="hm-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="bar">
        <span class="hm-bar-fill" id="bar-fill"></span>
      </div>
      <p class="status" id="status" aria-live="polite">Guess a letter</p>
    </div>

    <div class="hm-stage">
      <svg class="hm-figure" viewBox="0 0 120 130" aria-hidden="true">
        <g class="gallows">
          <path d="M10 122 H70"/>
          <path d="M28 122 V8"/>
          <path d="M28 8 H82"/>
          <path d="M82 8 V22"/>
        </g>
        <circle class="part" data-part="1" cx="82" cy="34" r="12"/>
        <path   class="part" data-part="2" d="M82 46 V80"/>
        <path   class="part" data-part="3" d="M82 56 L66 70"/>
        <path   class="part" data-part="4" d="M82 56 L98 70"/>
        <path   class="part" data-part="5" d="M82 80 L68 104 M82 80 L96 104"/>
      </svg>
      <p class="hm-hint">Hint: <span id="hint">—</span></p>
      <p class="hm-word" id="word" aria-live="polite"></p>
    </div>

    <div class="hm-keys" id="keys" role="group" aria-label="Letters"></div>

    <button class="btn btn-ghost btn-wide" id="new-game" type="button">Restart game</button>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <p class="sheet-emoji" id="sheet-emoji" aria-hidden="true">🎉</p>
      <h2 class="sheet-title" id="sheet-title">You win!</h2>
      <p class="sheet-text" id="sheet-text">You cleared all 10 words.</p>
      <button class="btn" id="sheet-btn" type="button">Play again</button>
      <a class="sheet-link" href="index.html">Back to all games</a>
    </div>
  </div>

  <script src="hangman.js"></script>
</body>
</html>
