<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four — Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <main class="app">
    <a class="back" href="index.html">All games</a>

    <header class="head">
      <h1>Connect Four</h1>
      <p class="status" id="status" aria-live="polite">Your turn</p>
    </header>

    <div class="modes" role="group" aria-label="Game mode">
      <button class="mode is-active" data-mode="cpu" type="button">vs Computer</button>
      <button class="mode" data-mode="human" type="button">2 Players</button>
    </div>

    <div class="board-wrap">
      <div class="grid" id="grid" role="grid" aria-label="Connect Four board, 7 columns by 6 rows">
        <!-- slots injected by connect4.js -->
      </div>

      <!-- End-of-round announcement; the status line carries it for screen readers -->
      <div class="result" id="result" hidden aria-hidden="true">
        <p class="result-title" id="result-title"></p>
        <p class="result-sub" id="result-sub"></p>
      </div>
    </div>

    <section class="scores" aria-label="Scores">
      <div class="score">
        <span class="score-label">Blue</span>
        <span class="score-value" id="score-r">0</span>
      </div>
      <div class="score">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-d">0</span>
      </div>
      <div class="score">
        <span class="score-label">Amber</span>
        <span class="score-value" id="score-y">0</span>
      </div>
    </section>

    <div class="actions">
      <button class="btn" id="new-round" type="button">New round</button>
      <button class="btn btn-ghost" id="reset-all" type="button">Reset scores</button>
    </div>
  </main>

  <!-- ?v= must be bumped whenever connect4.js or styles.css change, or browsers serve a stale cached copy -->
  <script src="connect4.js?v=2"></script>
</body>
</html>
